{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">⚙️ Edit Account Profile</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ current_user.username }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password <small class="text-muted">(Leave blank to keep current password)</small></label>
                        <input type="password" name="new_password" class="form-control" placeholder="Enter new password">
                    </div>

                    <hr>

                    <div class="mb-3">
                        <label class="form-label text-danger">Current Password <small>(Required to save changes)</small></label>
                        <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
